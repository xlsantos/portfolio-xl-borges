function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function mime(n){var e=n.split('.').pop().toLowerCase();return e==='svg'?'image/svg+xml':e==='png'?'image/png':(e==='jpg'||e==='jpeg')?'image/jpeg':e==='webp'?'image/webp':'application/octet-stream'}
document.getElementById('f').addEventListener('submit',async function(ev){
  ev.preventDefault();
  var erro=document.getElementById('erro');
  var senha=document.getElementById('p').value;
  erro.textContent='';
  try{
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(senha),'PBKDF2',false,['deriveKey']);
    var chave=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(D.salt),iterations:600000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var claro=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.iv)},chave,b64(D.ct));
    var html=new TextDecoder().decode(claro);
    if(D.imgs&&D.imgs.length){
      var ik=await crypto.subtle.deriveKey({name:'PBKDF2',salt:new TextEncoder().encode('xl-borges-imagens-cases-2026'),iterations:600000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
      for(var i=0;i<D.imgs.length;i++){
        var n=D.imgs[i];
        try{
          var r=await fetch('assets/locked/'+n);
          var buf=new Uint8Array(await r.arrayBuffer());
          var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},ik,buf.slice(12));
          var url=URL.createObjectURL(new Blob([pt],{type:mime(n)}));
          html=html.split('assets/media/'+n).join(url);
        }catch(err){}
      }
    }
    document.open();document.write(html);document.close();
  }catch(e){
    erro.textContent='Senha incorreta. Tente de novo.';
    document.getElementById('p').value='';
    document.getElementById('p').focus();
  }
});
})();
